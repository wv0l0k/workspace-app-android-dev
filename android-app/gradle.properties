org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 9.0 defaults to a new DSL/API surface and "built-in Kotlin" (no separate
# Kotlin Gradle plugin needed). This project still uses the traditional
# org.jetbrains.kotlin.android plugin and the classic `android { ... }` DSL,
# so these two flags keep that working as-is rather than requiring a bigger
# migration. Google has said the ability to opt out this way will be removed
# in AGP 10.0 (expected later in 2026) - if you're reading this well after
# that, you'll need to migrate to built-in Kotlin/the new DSL instead.
android.builtInKotlin=false
android.newDsl=false
