// Top-level build file - plugin versions only, applied per-module below.
// If Android Studio suggests bumping any of these when you open the project,
// that's normal (these tools move fast) - accept the suggestion. If you ever
// hit an AGP/Gradle version mismatch error, use Android Studio's own
// "AGP Upgrade Assistant" (Tools menu) rather than hand-editing these -
// it upgrades AGP and the Gradle wrapper together as a matched, tested pair.
plugins {
    id 'com.android.application' version '9.0.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.10' apply false
    id 'com.google.gms.google-services' version '4.5.0' apply false
}
