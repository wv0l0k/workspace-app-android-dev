name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Check Firebase configuration
        run: |
          if [ ! -f android-app/app/google-services.json ]; then
            echo "::error::Missing android-app/app/google-services.json"
            echo "Add your Firebase google-services.json before running the workflow."
            exit 1
          fi

      - name: Check signing configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          if [ -z "$PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > workspace-release.jks
          chmod 600 workspace-release.jks

      - name: Make Gradle wrapper executable
        run: chmod +x android-app/gradlew

      - name: Build release APK
        working-directory: android-app
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Read Android version
        id: version
        working-directory: android-app
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode[[:space:]]*\([0-9]*\).*/\1/p' app/build.gradle | head -n 1)

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle"
            exit 1
          fi

          echo "Version name: $VERSION_NAME"
          echo "Version code: $VERSION_CODE"

          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          APK="android-app/app/build/outputs/apk/release/app-release-unsigned.apk"

          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" \
            sign \
            --ks workspace-release.jks \
            --ks-key-alias key0 \
            --ks-pass env:KEYSTORE_PASSWORD \
            --out Workspace.apk \
            "$APK"

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" \
            verify \
            --verbose \
            Workspace.apk

      - name: Remove signing material
        run: |
          rm -f workspace-release.jks
          rm -f android-app/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          TAG="v${VERSION_NAME}"

          gh release create "$TAG" \
            Workspace.apk \
            --title "Workspace v${VERSION_NAME}" \
            --notes "Workspace Android app v${VERSION_NAME} (version code ${VERSION_CODE})."