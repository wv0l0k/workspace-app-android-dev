name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check Firebase configuration
        run: |
          if [ ! -f android-app/app/google-services.json ]; then
            echo "::error::Missing android-app/app/google-services.json"
            echo "Add your Firebase google-services.json before running this workflow."
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x android-app/gradlew

      - name: Build release APK
        working-directory: android-app
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: workspace-android-apk
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error